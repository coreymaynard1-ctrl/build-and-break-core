services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bnb
      POSTGRES_USER: bnb
      POSTGRES_PASSWORD: ${BNB_DEV_DB_PASSWORD:?Set BNB_DEV_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - bnb-development-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnb -d bnb"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bnb-development-db:
